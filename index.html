<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b130c">
<meta name="description" content="מגיני הקן — משחק הגנה בתלת־ממד: ציפורים ותותחים נגד מפלצות. AppNest.">
<meta property="og:title" content="מגיני הקן · NestDefense">
<meta property="og:description" content="ציפורים ותותחים נגד המפלצות — אף אחד לא נוגע בקן!">
<meta property="og:image" content="icon-512.png">
<title>מגיני הקן · NestDefense</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>

:root{--bg:#140e09;--card:#21170f;--card2:#2c2015;--gold:#e2a93b;--gold2:#ffd77a;--txt:#f6eedc;--mut:#b3a48a;--red:#e04545;--ok:#5fcf7f;--wood:#6a4325}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.modebar{display:flex;gap:8px;margin:10px 0 0}.modebar button{flex:1;background:rgba(20,14,9,.7);border:2px solid rgba(226,169,59,.35);border-radius:14px;padding:8px 10px;text-align:center}.modebar button b{display:block;font-size:17px;color:var(--gold2)}.modebar button small{display:block;font-size:12px;opacity:.8}.modebar button.on{border-color:var(--gold2);background:rgba(226,169,59,.25)}
body.war .modebar button[data-mode=war].on{border-color:#ff5a4a;background:rgba(160,30,20,.35)}body.war .modebar button[data-mode=war].on b{color:#ff8a7a}
body.war #bgHome{background:radial-gradient(ellipse at 50% 20%,#5a2a22 0%,#2a1414 45%,#0d0707 100%)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,12,6,.15),rgba(20,12,6,.86) 62%);touch-action:pan-y}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{width:100%;max-width:760px}
.logo{margin:6px 0 2px;text-align:center}
.logo h1{margin:0;font-size:clamp(32px,6vw,50px);letter-spacing:3px;font-weight:900;color:var(--gold2);text-shadow:0 3px 0 #5a3412,0 4px 18px rgba(0,0,0,.6);direction:ltr}
.logo h1 span{color:#fff}
.logo .heb{font-size:clamp(18px,3.4vw,24px);font-weight:900;color:#fff;text-shadow:0 2px 6px #000;margin-top:-2px}
.logo p{margin:4px 0 0;color:#f0e2c2;font-size:14px;text-shadow:0 1px 4px #000}
.modes{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px;margin:14px 0}
#playDaily.done{opacity:.7}
#kcbar{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 18px 10px;pointer-events:none;font-weight:800;letter-spacing:2px;color:var(--gold2);direction:ltr;z-index:30;text-shadow:0 2px 4px #000}
#kcbar.on{display:flex}#kcbar small{color:#ddd;letter-spacing:0;font-weight:600}
#kcbar:before,#kcbar:after{content:"";position:fixed;left:0;right:0;height:8vh;background:#000;z-index:-1}#kcbar:before{top:0}#kcbar:after{bottom:0}
#kcTap{position:fixed;inset:0;z-index:29;display:none}#kcTap.on{display:block}
body.kc #hud{opacity:0;pointer-events:none}
.mcard.ach.lock{opacity:.6}
@media (max-width:720px){.modes{grid-template-columns:1fr 1fr}.modes .big{grid-column:1/-1}}
.mode{position:relative;text-align:start;background:rgba(33,23,15,.9);border:2px solid rgba(226,169,59,.7);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;transition:transform .12s,border-color .12s;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.mode:active{transform:scale(.98);border-color:var(--gold2)}
.mode.big{background:linear-gradient(135deg,rgba(120,70,20,.95),rgba(60,34,12,.95))}
.mode.dim{opacity:.75}
.mode .ic{font-size:42px;line-height:1}
.mode b{display:block;font-size:20px;color:var(--gold2)}
.mode small{display:block;color:var(--txt);opacity:.9;font-size:13px;margin-top:3px;line-height:1.35}
.mode em{display:block;font-style:normal;color:var(--gold);font-size:13px;margin-top:6px;font-weight:700}
.homebar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.btn{background:rgba(20,14,9,.7);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:11px 18px;font-weight:700;min-height:44px}
.btn.solid{background:var(--gold);color:#241605;border-color:var(--gold)}
.btn.danger{border-color:var(--red);color:#ff8a8a}
.btn:active{transform:scale(.97)}
.badge{margin-top:14px;text-align:center;color:var(--mut);font-size:11px}
.badge b{color:var(--gold)}
.cash{display:inline-flex;align-items:center;gap:6px;background:rgba(20,14,9,.85);border:1px solid var(--gold);border-radius:20px;padding:4px 12px;color:var(--gold2);font-weight:800;margin:8px 4px 0}
.head{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin-bottom:10px}
.head h2{margin:0;font-size:20px;color:var(--gold2);text-shadow:0 1px 4px #000}
.bk{background:rgba(20,14,9,.8);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:8px 14px;font-weight:700;min-height:42px}
.set{background:rgba(33,23,15,.92);border:1px solid rgba(226,169,59,.3);border-radius:14px;padding:12px;margin-bottom:10px}
.set label{display:block;font-weight:700;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:40px;background:var(--card2);border:1px solid #4a3a28;border-radius:10px;padding:8px 10px;font-size:14px}
.seg button.on{background:var(--gold);color:#241605;border-color:var(--gold);font-weight:700}
.note{margin:8px 0 0;color:var(--mut);font-size:12px;line-height:1.4}
.set input{width:100%;min-height:42px;background:var(--card2);border:1px solid #4a3a28;border-radius:10px;color:var(--txt);padding:8px 10px;font-size:15px}
.row2{display:flex;gap:10px;flex-wrap:wrap}.row2 .btn{flex:1}
.info{background:rgba(33,23,15,.92);border:1px solid rgba(226,169,59,.3);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #3a2c1e}.info div:last-child{border:0}
.info span{color:var(--mut);flex:none}
.info b.cr{font-weight:500;font-size:12px;text-align:end;line-height:1.45}
.info h4{margin:6px 0 2px;color:var(--gold2);font-size:14px}
.links{display:grid;gap:8px;margin-bottom:12px}
.links a,.links button{display:block;text-align:center;text-decoration:none;background:rgba(20,14,9,.7);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;padding:11px;font-weight:700}
.disc{color:var(--mut);font-size:12px;line-height:1.5;text-align:center}
.aboutLogo{text-align:center;margin:4px 0 10px}.aboutLogo div{font-size:46px}.aboutLogo b{display:block;color:var(--gold2);font-size:22px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.chap{grid-column:1/-1;color:var(--gold2);font-weight:900;font-size:15px;margin:6px 2px -2px;text-shadow:0 1px 4px #000}
.mcard{position:relative;text-align:start;background:rgba(33,23,15,.92);border:2px solid rgba(226,169,59,.6);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;min-height:100px}
.mcard:active{transform:scale(.98)}
.mcard .ic{font-size:40px}.mcard b{display:block;color:var(--gold2);font-size:17px}.mcard small{display:block;font-size:12px;opacity:.88;line-height:1.35;margin-top:2px}
.mcard .st{color:var(--gold);letter-spacing:2px;font-size:16px;margin-top:4px}.mcard .bst{color:var(--mut);font-size:12px;margin-top:2px}
.mcard .num{position:absolute;top:8px;inset-inline-end:10px;color:var(--mut);font-size:12px;font-weight:800}
.mcard.lock{opacity:.55;border-color:#4a3a28}.mcard.lock .st{color:var(--mut);letter-spacing:0;font-size:12px}


/* overlays */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:30;padding:16px;touch-action:pan-y}
.ov.on{display:flex;animation:fade .2s}
.card{width:100%;max-width:470px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#2a1d12,#1c140c);border:2px solid rgba(226,169,59,.75);border-radius:18px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card h3{margin:0 0 8px;color:var(--gold2);font-size:21px}
.card p{margin:0 0 10px;line-height:1.5;font-size:15px}
.card .tip{color:var(--mut);font-size:13px}
.card .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.card .btns .btn{flex:1}
.vlist{display:grid;gap:10px}
#resTitle{font-size:26px;text-align:center}#resTitle.ok{color:var(--ok)}#resTitle.bad{color:var(--red)}
#resReason{text-align:center;color:var(--mut)}
#resStars{text-align:center;font-size:40px;color:var(--gold2);letter-spacing:8px;text-shadow:0 2px 0 #5a3412}
#resStats div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #3a2c1e}
#resStats span{color:var(--mut)}
#resBest{text-align:center;color:var(--gold2);font-weight:800;margin-top:6px}
.gIcon{font-size:56px;text-align:center}
#gDots{display:flex;gap:6px;justify-content:center;margin:6px 0}
#gDots i{width:8px;height:8px;border-radius:50%;background:#4a3a28}#gDots i.on{background:var(--gold)}
#loading{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#3a2614,#0d0805);z-index:60}
#loading.on{display:flex}
#loading h1{margin:0;font-size:40px;letter-spacing:3px;color:var(--gold2);font-weight:900;direction:ltr;text-shadow:0 3px 0 #5a3412}#loading h1 span{color:#fff}
#loading .lb{width:min(70vw,320px);height:10px;border-radius:5px;background:#2a1d12;border:1px solid rgba(226,169,59,.6);overflow:hidden}
#loadBar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .2s}
#loadTxt{color:var(--mut);font-size:13px}
@media (max-height:440px){.logo h1{font-size:32px}.modes{margin:8px 0}.mode{padding:10px}.mode .ic{font-size:32px}#bFire{width:92px;height:92px}#bZoom{width:52px;height:52px;bottom:146px}#joy{width:118px;height:118px}}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bgHome{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 20%,#3f6b33 0%,#1d3a20 45%,#0d140b 100%)}
.logo h1{direction:rtl}
/* HUD */
#hud{position:fixed;inset:0;display:none;pointer-events:none}
#hud.on{display:block}
#hud .top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(20,14,9,.74);border:1px solid rgba(226,169,59,.5);border-radius:12px;padding:6px 10px;font-size:16px;font-weight:800;color:var(--txt);min-height:40px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(3px)}
.pill b{color:var(--gold2)}
.pill.hit{animation:hitp .35s}@keyframes hitp{0%{border-color:#ff5a4a;background:rgba(120,20,10,.85)}100%{}}
#hud .rt{margin-inline-start:auto;display:flex;gap:8px}
.hb{pointer-events:auto;min-width:46px;justify-content:center;font-size:18px;cursor:pointer}
#bWave{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));inset-inline-end:max(16px,env(safe-area-inset-right));pointer-events:auto;border:2px solid #ffd77a;border-radius:18px;padding:12px 20px;font-weight:900;font-size:19px;background:linear-gradient(#f2c25a,#c98a1f);color:#241605;box-shadow:0 4px 0 #6b4210,0 6px 18px rgba(0,0,0,.45);min-height:58px}
#bWave.pulse{animation:pl 1s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.07)}}
#pots{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));inset-inline-start:max(16px,env(safe-area-inset-left));display:flex;gap:8px;pointer-events:auto}
.pot{width:56px;height:56px;border-radius:50%;border:2px solid rgba(226,169,59,.85);background:rgba(20,14,9,.66);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.pot small{font-size:11px;font-weight:800;color:var(--gold2)}.pot:disabled{opacity:.35}
#hud.lefty #bWave{inset-inline-end:auto;inset-inline-start:max(16px,env(safe-area-inset-left))}#hud.lefty #pots{inset-inline-start:auto;inset-inline-end:max(16px,env(safe-area-inset-right))}
#menu{position:fixed;z-index:25;background:linear-gradient(180deg,rgba(42,29,18,.97),rgba(28,20,12,.97));border:2px solid rgba(226,169,59,.75);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:min(470px,calc(100vw - 16px));display:none}
#menu.on{display:block}
.tgrid{display:grid;grid-template-columns:repeat(6,64px);gap:6px}
.tbtn{width:64px;height:76px;border-radius:14px;border:1px solid rgba(226,169,59,.35);background:var(--card2);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--gold2)}
.tbtn img{width:52px;height:52px;pointer-events:none}.tbtn .emo{font-size:30px;line-height:52px}.tbtn.on{border:2px solid var(--gold2);background:rgba(226,169,59,.3)}.tbtn.poor{opacity:.6}.tbtn.lock{opacity:.4;filter:grayscale(1)}.tbtn.ban{opacity:.3}
.mh{display:flex;align-items:center;gap:10px;padding:4px 2px}.mh img{width:58px;height:58px}.mh b{color:var(--gold2)}.mh small{display:block;opacity:.85;font-size:13px}.mh.sm{margin-top:8px;justify-content:space-between}.mh .emo{font-size:36px}
.mrow{display:flex;gap:8px;margin-top:8px}.mbtn{border:1px solid var(--gold);background:rgba(20,14,9,.7);color:var(--gold2);border-radius:12px;padding:10px 14px;font-weight:800;min-height:52px;flex:1;white-space:nowrap}.mbtn.pri{background:var(--gold);color:#241605}.mbtn:disabled{opacity:.45}.mbtn.x{flex:0 0 52px}
#msg{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;width:90vw;z-index:22}
#msg.on{animation:pop 2.6s ease forwards}
#msgA{font-size:clamp(26px,5.5vw,40px);font-weight:900;color:var(--gold2);text-shadow:0 2px 0 #5a3412,0 3px 10px #000}#msgB{font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}18%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:16%;transform:translateX(-50%);background:rgba(20,14,9,.94);border:1px solid var(--gold);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#rotHint{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#120d08;color:var(--gold2);font-size:22px;font-weight:900;text-align:center;padding:30px}
@media (orientation:portrait) and (pointer:coarse){body.ingame #rotHint{display:flex}}
.item{display:flex;gap:12px;align-items:center;background:rgba(33,23,15,.94);border:2px solid rgba(226,169,59,.3);border-radius:14px;padding:10px;margin-bottom:10px}
.item .emo{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;font-size:36px;background:radial-gradient(#3a2a1a,#1c140c);border-radius:10px}
.item .inf{flex:1;min-width:0}.item .inf b{color:var(--gold2);font-size:16px}.item .inf small{display:block;opacity:.85;font-size:12px;line-height:1.35;margin-top:2px}
.pips{display:flex;gap:5px;margin-top:6px}.pips i{width:22px;height:7px;border-radius:4px;background:#4a3a28}.pips i.on{background:var(--gold)}
.btn.poor{opacity:.5}
.dmods{display:block;color:var(--gold);font-size:12px;margin-top:4px}
.tw-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.tw-row img{width:40px;height:40px}
@media (max-height:440px){.logo h1{font-size:32px}.modes{margin:8px 0}.mode{padding:10px}.mode .ic{font-size:32px}.tgrid{grid-template-columns:repeat(6,56px)}.tbtn{width:56px;height:66px}.tbtn img{width:44px;height:44px}.pot{width:50px;height:50px}#bWave{min-height:50px;font-size:17px;padding:10px 16px}.pill{font-size:14px;min-height:36px;padding:4px 8px}}

</style>
</head>
<body>
<div id="bgHome"></div>
<div id="stage" style="position:fixed;inset:0;display:none"></div>

<div id="loading" class="on"><h1>🪺 <span>מגיני הקן</span></h1><div class="lb"><div id="loadBar"></div></div><div id="loadTxt" data-t="loading"></div></div>

<section class="screen" id="home">
  <div class="wrap">
    <div class="logo"><h1>🪺 <span data-t="title"></span></h1><div class="heb" dir="ltr">NestDefense</div><p data-t="tagline"></p><span class="cash">🪙 <span id="cashHome">0</span></span><span class="cash" id="starsHome"></span></div>
    <div class="modebar" id="modeBar"></div>
    <div class="modes">
      <button class="mode big" data-go="levels"><div class="ic">🐦</div><div><b data-t="play"></b><small data-t="playD"></small></div></button>
      <button class="mode" data-go="shop"><div class="ic">🛒</div><div><b data-t="shop"></b><small data-t="shopD"></small></div></button>
      <button class="mode" id="playEndless"><div class="ic">♾️</div><div><b data-t="endless"></b><small data-t="endlessD"></small><em id="endBest"></em></div></button>
      <button class="mode" id="playDaily"><div class="ic">📅</div><div><b data-t="daily"></b><small id="dailyD"></small><em id="dailySt"></em></div></button>
    </div>
    <div class="homebar"><button class="btn" data-go="achs">🏅 <span data-t="achs"></span> <span id="achHomeN"></span></button><button class="btn" data-go="settings">⚙️ <span data-t="settings"></span></button><button class="btn" data-go="about">ℹ️ <span data-t="about"></span></button></div>
    <div class="badge"><b>AppNest</b> · <span id="ver"></span></div>
  </div>
</section>

<section class="screen" id="levels">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="levels"></h2><span class="cash" id="starsLv" style="margin:0 auto 0 0"></span></div>
  <div class="wrap"><div id="lvlList" class="mgrid"></div></div>
</section>

<section class="screen" id="shop">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="shop"></h2><span class="cash" style="margin:0 auto 0 0">🪙 <span id="cashShop">0</span></span></div>
  <div class="wrap"><div id="shopList"></div><p class="note" data-t="shopHint" style="text-align:center"></p></div>
</section>

<section class="screen" id="achs">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="achs"></h2><span class="cash" id="achCount" style="margin:0 auto 0 0"></span></div>
  <div class="wrap"><div id="achList" class="mgrid"></div></div>
</section>

<section class="screen" id="settings">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="settings"></h2></div>
  <div class="wrap" id="setList"></div>
</section>

<section class="screen" id="about">
  <div class="head"><button class="bk" data-back><span class="arr">→</span> <span data-t="home"></span></button><h2 data-t="about"></h2></div>
  <div class="wrap">
    <div class="aboutLogo"><div>🪺</div><b><span data-t="title"></span> · NestDefense</b></div>
    <div class="info" id="aboutInfo"></div>
